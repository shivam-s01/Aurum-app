pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    // REVERTED (2026-07-27): a previous change dropped this to "1.9.24"
    // to chase what turned out to be a transient network/DNS resolution
    // failure in the build log (unrelated to Kotlin version at all) —
    // that was the wrong diagnosis. The real, confirmed problem this
    // caused: image_picker_android (a Flutter plugin dependency) ships
    // classes compiled with Kotlin metadata version 2.1.0, which a 1.9.x
    // compiler cannot read at all (error: "compiled with an incompatible
    // version of Kotlin ... compiler version 1.9.0 can read versions up
    // to 2.0.0") — a hard compile failure on :image_picker_android:compileReleaseKotlin.
    // Kotlin 2.1.0 is also officially within Gradle's own tested range
    // (Gradle docs: "Gradle is tested with Kotlin 2.0.0 through
    // 2.4.0-RC") and matches published production compatibility tables
    // pairing Gradle 8.11.1 with Kotlin 2.1.x/2.2.x. Restoring 2.1.0 so
    // image_picker_android's classes are readable again; the original
    // network error was unrelated to this version and should be
    // resolved by simply re-running the build.
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"
