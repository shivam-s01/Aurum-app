<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurum Splash — Astra Music</title>
<style>
  :root {
    --cyan: #4FE8D8;
    --violet: #A47BFF;
    --bg-dark: #13121C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg-dark);
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .stage {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(ellipse 60% 40% at 50% 38%, rgba(79,232,216,0.05) 0%, rgba(79,232,216,0) 70%),
      radial-gradient(ellipse 55% 45% at 50% 55%, rgba(164,123,255,0.05) 0%, rgba(164,123,255,0) 70%),
      var(--bg-dark);
  }
  .glow {
    position: absolute;
    width: 460px;
    height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(90,220,210,0.07) 0%,
      rgba(140,140,220,0.04) 38%,
      rgba(120,90,200,0.015) 62%,
      rgba(0,0,0,0) 78%);
    opacity: 0;
    animation: glowIn 1.8s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
  }
  @keyframes glowIn {
    to { opacity: 1; transform: scale(1.05); }
  }
  .wordmark {
    position: relative;
    text-align: center;
    line-height: 0.92;
  }
  svg.astra {
    display: block;
    width: min(74vw, 340px);
    height: auto;
    overflow: visible;
  }
  .stroke-path {
    fill: none;
    stroke-width: 5.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1400;
    stroke-dashoffset: 1400;
    animation: draw 1.35s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
  }
  .fill-letters {
    opacity: 0;
    animation: fillIn 0.5s ease-out 1.25s forwards;
  }
  .sheen {
    opacity: 0;
  }
  .sheen-run {
    animation: sheenSweep 1.1s ease-out 1.55s forwards;
  }
  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes sheenSweep {
    0% { opacity: 0; transform: translateX(-140px); }
    15% { opacity: 0.9; }
    55% { opacity: 0.9; }
    100% { opacity: 0; transform: translateX(140px); }
  }
  @keyframes fillIn {
    to { opacity: 1; }
  }
  .music {
    display: block;
    margin-top: 2px;
    font-size: min(6.4vw, 27px);
    font-weight: 400;
    letter-spacing: 0.5em;
    padding-left: 0.5em;
    color: #DEDCE6;
    opacity: 0;
    transform: translateY(24px);
    animation: riseIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.35s forwards;
  }
  @keyframes riseIn {
    0% { opacity: 0; transform: translateY(24px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .underline {
    height: 1.5px;
    width: 0;
    margin: 15px auto 0;
    background: linear-gradient(90deg, transparent, var(--cyan) 30%, var(--violet) 70%, transparent);
    animation: expandLine 0.7s cubic-bezier(0.16,1,0.3,1) 1.7s forwards;
  }
  @keyframes expandLine {
    to { width: 130px; }
  }
  .wordmark-group {
    animation: breathe 3.2s ease-in-out 2.3s infinite;
  }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(150,180,255,0)); }
    50% { filter: drop-shadow(0 0 14px rgba(150,180,255,0.18)); }
  }
  .spark {
    opacity: 0;
    fill: #fff;
  }
  .spark-run {
    animation: sparkPop 0.7s ease-out forwards;
  }
  @keyframes sparkPop {
    0% { opacity: 0; transform: scale(0.3); }
    35% { opacity: 0.85; }
    100% { opacity: 0; transform: scale(1.3); }
  }
  .bars {
    position: absolute;
    bottom: 14%;
    display: flex;
    align-items: flex-end;
    gap: 5px;
    height: 20px;
    opacity: 0;
    animation: fadeIn 0.5s ease-out 1.9s forwards;
  }
  @keyframes fadeIn { to { opacity: 0.85; } }
  .bars span {
    width: 2.5px;
    border-radius: 2px;
    animation: bounce 1s ease-in-out infinite;
  }
  .bars span:nth-child(1) { height: 7px; background: var(--cyan); animation-delay: 0s; }
  .bars span:nth-child(2) { height: 16px; background: #7CE9DB; animation-delay: 0.12s; }
  .bars span:nth-child(3) { height: 11px; background: #9C9BEE; animation-delay: 0.24s; }
  .bars span:nth-child(4) { height: 18px; background: var(--violet); animation-delay: 0.36s; }
  .bars span:nth-child(5) { height: 8px; background: #C9A6FF; animation-delay: 0.48s; }
  @keyframes bounce {
    0%, 100% { transform: scaleY(0.45); }
    50% { transform: scaleY(0.95); }
  }
  .replay {
    position: absolute;
    bottom: 5%;
    background: transparent;
    border: 0.5px solid rgba(164,123,255,0.3);
    color: var(--cyan);
    font-size: 11px;
    padding: 7px 16px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }
  .replay:active { transform: scale(0.97); }
  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    filter: blur(0.5px);
    animation: drift linear infinite, particleFade 1.2s ease-out forwards;
  }
  @keyframes particleFade {
    to { opacity: var(--pmax, 0.5); }
  }
  @keyframes drift {
    from { transform: translateY(0) translateX(0); }
    to { transform: translateY(-70px) translateX(var(--dx, 8px)); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="particles" id="particles"></div>
  <div class="glow" id="glow"></div>
  <div class="wordmark">
    <svg class="astra" id="astra" viewBox="0 0 620 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8FF6E9"/>
          <stop offset="40%" stop-color="#4FE8D8"/>
          <stop offset="75%" stop-color="#A47BFF"/>
          <stop offset="100%" stop-color="#C9A6FF"/>
        </linearGradient>
      </defs>
      <g class="wordmark-group">
      <text class="stroke-path" id="strokeText" x="310" y="118" text-anchor="middle"
        font-size="118" font-weight="700" letter-spacing="2"
        stroke="url(#strokeGrad)" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">ASTRA</text>
      <text class="fill-letters" id="fillText" x="310" y="118" text-anchor="middle"
        font-size="118" font-weight="700" letter-spacing="2"
        fill="url(#strokeGrad)" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">ASTRA</text>
      <clipPath id="letterClip">
        <text x="310" y="118" text-anchor="middle" font-size="118" font-weight="700"
          letter-spacing="2" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">ASTRA</text>
      </clipPath>
      <g clip-path="url(#letterClip)">
        <rect class="sheen sheen-run" id="sheen" x="0" y="0" width="60" height="160"
          fill="rgba(255,255,255,0.55)" transform="skewX(-20)"/>
      </g>
      <circle class="spark spark-run" cx="70" cy="60" r="1.6" style="animation-delay:0.25s"/>
      <circle class="spark spark-run" cx="185" cy="42" r="1.2" style="animation-delay:0.42s"/>
      <circle class="spark spark-run" cx="300" cy="55" r="1.5" style="animation-delay:0.58s"/>
      <circle class="spark spark-run" cx="415" cy="45" r="1.1" style="animation-delay:0.74s"/>
      <circle class="spark spark-run" cx="530" cy="58" r="1.6" style="animation-delay:0.9s"/>
      </g>
    </svg>
    <span class="music" id="music">MUSIC</span>
    <div class="underline" id="line"></div>
  </div>
  <div class="bars" id="bars">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <button class="replay" id="replay">Replay</button>
</div>
<script>
  const ids = ['glow','strokeText','fillText','sheen','music','line','bars'];
  const colors = ['#8FF6E9','#4FE8D8','#A47BFF','#C9A6FF','#9C9BEE'];
  function spawnParticles() {
    const box = document.getElementById('particles');
    box.innerHTML = '';
    const w = box.clientWidth || 380;
    const h = box.clientHeight || 640;
    const count = 22;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      const size = 1 + Math.random() * 2.2;
      const left = Math.random() * w;
      const top = h * 0.35 + Math.random() * h * 0.6;
      const dur = 7 + Math.random() * 9;
      const delay = Math.random() * 3.5;
      const dx = (Math.random() - 0.5) * 30;
      const pmax = 0.15 + Math.random() * 0.35;
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.className = 'particle';
      p.style.cssText =
        'width:' + size + 'px;height:' + size + 'px;' +
        'left:' + left + 'px;top:' + top + 'px;' +
        'background:' + color + ';' +
        '--dx:' + dx + 'px;--pmax:' + pmax + ';' +
        'animation-duration:' + dur + 's,1.2s;' +
        'animation-delay:' + delay + 's,' + delay + 's;';
      box.appendChild(p);
    }
  }
  spawnParticles();
  document.getElementById('replay').addEventListener('click', () => {
    const wg = document.querySelector('.wordmark-group');
    ids.forEach(id => {
      const el = document.getElementById(id);
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
    document.querySelectorAll('.spark').forEach(s => {
      s.classList.remove('spark-run');
      void s.getBBox();
      s.classList.add('spark-run');
    });
    if (wg) {
      wg.style.animation = 'none';
      void wg.getBBox();
      wg.style.animation = '';
    }
    spawnParticles();
  });

  // --- Flutter handoff (added; does not affect any visual timing above) ---
  // Hides the web-only Replay button (it has no purpose on a real
  // cold-start splash) and, once the last scripted animation in the
  // timeline (the underline, finishing at 1.7s + 0.7s = 2.4s) has had
  // time to fully settle, posts a message so the native SplashScreen
  // can begin its own smooth crossfade into the app. This does not
  // start, alter, or shorten any CSS animation above — it only
  // observes the existing timeline and reports when it's done.
  (function () {
    const replayBtn = document.getElementById('replay');
    if (replayBtn) replayBtn.style.display = 'none';
    const notifyDoneMs = 2400 + 800; // underline end + longer settle beat (was 200 — animation read as under 3s total)
    setTimeout(() => {
      if (window.AurumSplash && window.AurumSplash.postMessage) {
        window.AurumSplash.postMessage('done');
      }
    }, notifyDoneMs);
  })();
</script>
</body>
</html>
