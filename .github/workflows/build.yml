name: Build Aurum Music APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed so the "Create Release" step can publish the built APK as a GitHub release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # persist-credentials required (true) — the "Commit bumped
          # version back to repo" step below now pushes a commit using
          # this checkout's saved GITHUB_TOKEN credentials.
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/aurum-release.jks

      - name: Write key.properties
        run: |
          printf 'storePassword=${{ secrets.STORE_PASSWORD }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=aurum-release.jks\n' > android/key.properties

      - name: Flutter clean (prevent stale build artifacts)
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (safety gate — stops here on real errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Bump build number (persisted in pubspec.yaml)
        # FIX ("update popup fake/not showing — app is always 'up to
        # date'"): this used to set the build number to
        # github.run_number every run, WITHOUT ever committing that
        # change back to the repo. Two problems from that: (1)
        # pubspec.yaml in git stayed frozen at whatever it was last
        # hand-edited to (2.3.2+345 here) forever, so UpdateService's
        # comparison logic and any docs/checkouts reading the repo saw
        # a stale number; (2) run_number counts EVERY workflow run
        # (including failed/re-run/workflow_dispatch runs), so it can
        # jump unpredictably and doesn't reflect "how many releases have
        # actually shipped" — it's a CI counter, not a release counter.
        # Fix: read the last committed build number from pubspec.yaml,
        # increment it by exactly 1, write it back into pubspec.yaml,
        # and commit+push that change (below) so it's the permanent,
        # ever-increasing source of truth — matching the tag/release
        # name AND what ships inside the APK AND what's visible in the
        # repo, always in lockstep.
        #
        # ONE-TIME RESYNC: pubspec.yaml was stuck at +345 while GitHub
        # Releases had already reached build1125 (from the old
        # run_number-based scheme). Floor LAST_BUILD at 1125 so this
        # first bump continues from 1126 onward instead of restarting
        # at 346 and looking like an OLDER build than what's already
        # been released and possibly installed on phones. Every run
        # after this one just increments normally — this floor only
        # ever matters once.
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '\r')
          LAST_BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//' | tr -d '\r')
          if [ "$LAST_BUILD" -lt 1125 ]; then
            LAST_BUILD=1125
          fi
          NEW_BUILD=$((LAST_BUILD + 1))
          NEW_VERSION="${BASE_VERSION}+${NEW_BUILD}"
          sed -i "s/^version:.*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "Bumped pubspec.yaml version ${LAST_BUILD} -> ${NEW_BUILD} (${NEW_VERSION})"

      - name: Commit bumped version back to repo
        # Runs before the actual APK build so a build failure never
        # leaves the bump uncommitted (which would silently repeat the
        # same +1 next run and desync from what actually shipped).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build number [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build Release APK
        # FIX (build failures from transient upstream 429 "Too Many
        # Requests" on plugins.gradle.org / repo.maven.apache.org):
        # Gradle's own internal dependency-download retry only waits
        # ~100ms between attempts — nowhere near long enough to outlast
        # a server-side rate-limit window, so it was hitting the same
        # 429 again immediately and failing the whole build. This wraps
        # the actual build command in its own retry loop with real
        # backoff (30s, then 60s) so a transient rate-limit has an
        # actual chance to clear before the next attempt, instead of
        # requiring a manual empty-commit re-run every time it happens.
        #
        # --dart-define passes GH_RELEASE_TOKEN in at build time so
        # UpdateService's GitHub API call is authenticated (5000 req/hour
        # instead of 60/hour shared across every user's IP — see
        # update_service.dart's doc comment for how the unauthenticated
        # limit was silently breaking the update popup for everyone).
        # The secret is injected by the Actions runner and only ever
        # lives in this ephemeral environment — it is never written to
        # any file in the repo.
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi --dart-define=GH_RELEASE_TOKEN="$GH_RELEASE_TOKEN"; then
              exit 0
            fi
            echo "Build attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              wait_seconds=$((attempt * 30))
              echo "Waiting ${wait_seconds}s before retrying (likely a transient upstream rate-limit)..."
              sleep "$wait_seconds"
            fi
          done
          echo "Build failed after 3 attempts."
          exit 1

      - name: Get version
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          BUILD=$(echo $VERSION | cut -d'+' -f2)
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurum-music-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Create Release
        # Gate removed (per explicit request): every successful push to
        # main/master now always creates/updates a GitHub release,
        # unconditionally — no [release] keyword needed.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build${{ steps.ver.outputs.build }}
          name: Build ${{ steps.ver.outputs.build }}
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify users of new update (FCM push)
        # Runs on every release now (gate removed, see Create Release
        # above). Separately, and regardless of that: silently skipped
        # (not failed) if the FIREBASE_SERVICE_ACCOUNT secret hasn't been
        # added yet, so this step is a no-op until FCM_SETUP.md's steps
        # are done, rather than breaking the whole release pipeline for
        # anyone who hasn't set up push notifications yet.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret not set — skipping push notification (see FCM_SETUP.md)."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/fcm-service-account.json
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/fcm-service-account.json'))['project_id'])")

          # OAuth2 access token via the service account's private key (JWT
          # bearer flow) — no extra CLI/tooling needed beyond openssl+curl,
          # which every ubuntu-latest runner already has.
          #
          # YAML-SAFETY NOTE: every line of this embedded Python script is
          # kept indented at least as far as this `run: |` block's own
          # baseline indentation (10 spaces) — a literal block scalar in
          # YAML ends at the first line indented LESS than its first
          # content line, so a flush-left heredoc body here would
          # silently truncate the workflow (everything after would be
          # parsed as sibling YAML keys, not job steps) rather than
          # failing loudly. textwrap.dedent() strips that shared leading
          # whitespace back off before Python actually runs the code, so
          # this indentation is purely to keep YAML's parser happy and
          # has zero effect on the script's actual behavior.
          python3 - <<'PYEOF'
          import json, time, base64, subprocess, textwrap

          src = textwrap.dedent("""
          import json, time, base64, subprocess, os

          with open('/tmp/fcm-service-account.json') as f:
              sa = json.load(f)

          now = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          claims = {
              "iss": sa["client_email"],
              "scope": "https://www.googleapis.com/auth/firebase.messaging",
              "aud": "https://oauth2.googleapis.com/token",
              "iat": now,
              "exp": now + 3600,
          }

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          signing_input = f"{b64url(json.dumps(header).encode())}.{b64url(json.dumps(claims).encode())}"

          with open('/tmp/pkey.pem', 'w') as f:
              f.write(sa["private_key"])

          sig = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", "/tmp/pkey.pem"],
              input=signing_input.encode(), capture_output=True, check=True
          ).stdout
          jwt = f"{signing_input}.{b64url(sig)}"

          with open('/tmp/jwt.txt', 'w') as f:
              f.write(jwt)
          """)
          exec(src)
          PYEOF

          JWT=$(cat /tmp/jwt.txt)
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${JWT}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")

          curl -s -X POST "https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"message\": {
                \"topic\": \"updates\",
                \"notification\": {
                  \"title\": \"Update available\",
                  \"body\": \"A new version of Aurum is ready to install.\"
                }
              }
            }"

          rm -f /tmp/fcm-service-account.json /tmp/pkey.pem /tmp/jwt.txt

  # ════════════════════════════════════════════════════════════════════════
  # WEB PREVIEW — builds a browser-viewable version of the UI and publishes
  # it to GitHub Pages, so the design can be checked from a phone browser
  # in ~2-3 min instead of waiting on a full APK build. This is UI/layout
  # preview only: native-only features (Hive local storage, background
  # audio, downloads, native login flows, etc.) will not work identically
  # on web — treat this as "does the screen look right", not a functional
  # test. Runs independently of the `build` job above (separate job, same
  # trigger) so it can never block or slow down the real APK pipeline; if
  # this job fails, the APK build is unaffected.
  web-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Enable web support and scaffold web/ if missing
        # FIX (no web/ folder in this repo yet — it's a mobile-only
        # project): `flutter create --platforms=web .` is safe to run
        # every time — it only adds/updates the web/ scaffolding files
        # and never touches lib/ or any other existing source, so it
        # won't conflict with or overwrite app code on repeat runs.
        run: |
          flutter config --enable-web
          flutter create --platforms=web .

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (release, relative base-href for Pages subpath)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
