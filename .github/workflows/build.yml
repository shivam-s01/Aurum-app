name: Build Astra Music APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Naya push aaye to purani chal rahi build cancel ho jaye (queue me atakna band)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write  # needed so the "Create Release" step can publish the built APK as a GitHub release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # persist-credentials required (true) — the "Publish check.json
          # to 'update' branch" step later on still pushes a commit
          # using this checkout's saved GITHUB_TOKEN credentials. (The
          # old build-number bump-and-commit step no longer exists, so
          # this is no longer needed for that — kept for check.json.)
          persist-credentials: true
          fetch-depth: 0

      - name: Free disk space (runner was hitting "No space left on device")
        # The APK build died in :app:stripReleaseDebugSymbols with "No space
        # left on device". Delete big preinstalled toolchains this job never
        # uses (Android SDK/NDK and Java are kept — Java is reinstalled by
        # the next step anyway).
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /opt/microsoft /opt/az /usr/local/lib/node_modules || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/aurum-release.jks

      - name: Write key.properties
        run: |
          printf 'storePassword=${{ secrets.STORE_PASSWORD }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=aurum-release.jks\n' > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (safety gate — stops here on real errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compute build number (timestamp-based — always increasing, zero maintenance)
        # SIMPLEST POSSIBLE FIX — replaces the entire floor-tracking +
        # git-commit + push-retry/rebase machinery above (four separate
        # manual "resyncs" over time, and it STILL drifted — repo showed
        # +3137 while build5137 was already on real phones) with
        # something that structurally cannot drift again: the build
        # number is just "seconds since a fixed reference date"
        # (2024-01-01 UTC). Time only ever moves forward, on every
        # machine, in every run — manual dispatch, retry, re-run,
        # doesn't matter — so this number is *guaranteed* to always be
        # higher than any previous build. No floor to track, no
        # pubspec.yaml write-back, no git commit, no push race, no
        # rebase retry logic, no GitHub API calls needed at all.
        # Comfortably fits Android's versionCode ceiling (~2.1 billion)
        # until roughly the year 2090.
        id: build_number
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '\r')
          EPOCH_BASE=1704067200   # 2024-01-01T00:00:00Z reference point
          BUILD_NUMBER=$(( $(date -u +%s) - EPOCH_BASE ))
          echo "BASE_VERSION=${BASE_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "build=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          # Short, human-friendly label shown in Settings → About
          # (IST date yymmdd + CI run number, e.g. 261027.142). Display
          # only — the real versionCode above is untouched, so update
          # checks for existing website-APK users keep working.
          BUILD_LABEL="$(TZ=Asia/Kolkata date +%y%m%d).${GITHUB_RUN_NUMBER}"
          echo "BUILD_LABEL=${BUILD_LABEL}" >> "$GITHUB_ENV"
          echo "Building version ${BASE_VERSION}, build ${BUILD_NUMBER}, label ${BUILD_LABEL}"

      - name: Build Release APK
        # FIX (build failures from transient upstream 429 "Too Many
        # Requests" on plugins.gradle.org / repo.maven.apache.org):
        # Gradle's own internal dependency-download retry only waits
        # ~100ms between attempts — nowhere near long enough to outlast
        # a server-side rate-limit window, so it was hitting the same
        # 429 again immediately and failing the whole build. This wraps
        # the actual build command in its own retry loop with real
        # backoff (30s, then 60s) so a transient rate-limit has an
        # actual chance to clear before the next attempt, instead of
        # requiring a manual empty-commit re-run every time it happens.
        run: |
          # --build-name/--build-number override whatever's in
          # pubspec.yaml with the values computed in "Compute build
          # number" above, so pubspec.yaml never needs to be edited or
          # committed for this at all.
          for attempt in 1 2 3; do
            D=/usr/local/lib/android/sdk/ndk/27.0.12077973; if [ -d "$D" ] && [ ! -f "$D/source.properties" ]; then echo "Removing broken NDK"; sudo rm -rf "$D"; fi
            if flutter build apk --release --split-per-abi --target-platform android-arm64 \
              --obfuscate --split-debug-info=build/symbols \
              --build-name="$BASE_VERSION" --build-number="$BUILD_NUMBER" \
              --dart-define=BUILD_LABEL="$BUILD_LABEL"; then
              exit 0
            fi
            echo "Build attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              wait_seconds=$((attempt * 30))
              echo "Waiting ${wait_seconds}s before retrying (likely a transient upstream rate-limit)..."
              sleep "$wait_seconds"
            fi
          done
          echo "Build failed after 3 attempts."
          exit 1

      - name: Generate polished changelog
        id: changelog
        # Turns raw commit messages into a clean, categorized release
        # body WITHOUT any AI/API call — pure text processing, so it
        # costs nothing and needs no secret key. Sorts each commit into
        # one of a fixed set of sections by its conventional-commit-style
        # prefix (fix:/add:/feat:/improve:/perf:/remove:/docs:), title-
        # cases the message, and only prints sections that actually have
        # content — so a push with just one fix never shows four empty
        # headers. This is what UpdateService's _parseHighlights() reads
        # on-device to build the "WHAT'S NEW" list in the update popup,
        # so the section headers/bullets emitted here are intentionally
        # plain markdown ("## Heading", "- bullet") with NO emoji baked
        # directly into the text — _parseHighlights() strips markdown
        # heading/bullet markers but keeps emoji, so emoji are added
        # per-section below and survive into the on-device popup, while
        # raw "## " noise never does.
        run: |
          # Commits since the previous tag only (not the whole repo
          # history) — falls back to the last 20 commits on the very
          # first release, when no previous tag exists yet.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s")
          else
            COMMITS=$(git log -20 --pretty=format:"%s")
          fi

          declare -A SECTIONS
          SECTIONS[feat]=""
          SECTIONS[fix]=""
          SECTIONS[improve]=""
          SECTIONS[perf]=""
          SECTIONS[remove]=""
          SECTIONS[docs]=""
          SECTIONS[other]=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # Never surface the bot's own bump commits as a user-facing
            # changelog line — [skip ci] already keeps them from
            # retriggering CI, this keeps them out of what users read.
            case "$line" in
              *"[skip ci]"*) continue ;;
            esac

            lower=$(echo "$line" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              feat:*|add:*|added:*)      key=feat;    msg="${line#*:}" ;;
              fix:*|fixed:*|bugfix:*)    key=fix;     msg="${line#*:}" ;;
              improve:*|improved:*|refactor:*) key=improve; msg="${line#*:}" ;;
              perf:*|performance:*)      key=perf;    msg="${line#*:}" ;;
              remove:*|removed:*|chore:*) key=remove; msg="${line#*:}" ;;
              docs:*|doc:*)              key=docs;    msg="${line#*:}" ;;
              *)                         key=other;   msg="$line" ;;
            esac

            # Trim leading space left after stripping "prefix:", then
            # capitalize just the first letter — title-casing the WHOLE
            # message would mangle proper nouns/code identifiers that
            # are already correctly cased (e.g. "SongTile", "GitHub").
            msg=$(echo "$msg" | sed 's/^ *//')
            first_char=$(echo "${msg:0:1}" | tr '[:lower:]' '[:upper:]')
            msg="${first_char}${msg:1}"

            SECTIONS[$key]="${SECTIONS[$key]}- ${msg}
          "
          done <<< "$COMMITS"

          {
            if [ -n "${SECTIONS[feat]}" ]; then
              echo "## ✨ New"
              printf '%s' "${SECTIONS[feat]}"
              echo ""
            fi
            if [ -n "${SECTIONS[improve]}" ]; then
              echo "## ⚡ Improved"
              printf '%s' "${SECTIONS[improve]}"
              echo ""
            fi
            if [ -n "${SECTIONS[fix]}" ]; then
              echo "## 🐛 Fixed"
              printf '%s' "${SECTIONS[fix]}"
              echo ""
            fi
            if [ -n "${SECTIONS[perf]}" ]; then
              echo "## 🚀 Performance"
              printf '%s' "${SECTIONS[perf]}"
              echo ""
            fi
            if [ -n "${SECTIONS[docs]}" ]; then
              echo "## 📝 Docs"
              printf '%s' "${SECTIONS[docs]}"
              echo ""
            fi
            if [ -n "${SECTIONS[remove]}" ]; then
              echo "## 🧹 Housekeeping"
              printf '%s' "${SECTIONS[remove]}"
              echo ""
            fi
            if [ -n "${SECTIONS[other]}" ]; then
              echo "## 🔧 Other changes"
              printf '%s' "${SECTIONS[other]}"
              echo ""
            fi
          } > /tmp/changelog_body.md

          # Guaranteed non-empty fallback: if every commit in this
          # range was filtered out (e.g. the only commit was a
          # [skip ci] bump), still ship a body instead of an empty
          # release description.
          if [ ! -s /tmp/changelog_body.md ]; then
            echo "## ⚡ Improved" > /tmp/changelog_body.md
            echo "- General improvements and stability fixes" >> /tmp/changelog_body.md
          fi

          echo "Generated changelog:"
          cat /tmp/changelog_body.md

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/astra-music-arm64-v8a-release.apk

      - name: Upload APK
        # continue-on-error: the same APK is attached to the GitHub release in
        # the next step, so a full Actions artifact quota must not block it.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: astra-music-release
          path: build/app/outputs/flutter-apk/astra-music-arm64-v8a-release.apk
          retention-days: 1

      - name: Create Release
        # Gate removed (per explicit request): every successful push to
        # main/master now always creates/updates a GitHub release,
        # unconditionally — no [release] keyword needed.
        #
        # body_path points at the categorized changelog generated above
        # instead of relying on this action's own default (raw commit
        # log dump) — that raw dump is what used to show up verbatim as
        # a single flat bullet in the on-device "WHAT'S NEW" list.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build${{ steps.build_number.outputs.build }}
          name: Astra Music — Build ${{ steps.build_number.outputs.build }}
          body_path: /tmp/changelog_body.md
          files: build/app/outputs/flutter-apk/astra-music-arm64-v8a-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish check.json to 'update' branch
        # Drives the in-app update popup. Rewritten to be failure-proof:
        #  * versionCode is read from the BUILT APK (aapt2) — Flutter's
        #    --split-per-abi adds an ABI offset to the versionCode, so the
        #    raw BUILD_NUMBER can differ from what PackageInfo reports on
        #    the phone. Comparing against the real number is always right.
        #  * publishes from a throwaway repo and force-pushes a single
        #    commit — no checkout of the 'update' branch inside the dirty
        #    build workspace (that checkout could abort on modified files),
        #    no rebase/retry races. check.json only ever needs the latest.
        run: |
          set -e
          BUILD_NUM="${{ steps.build_number.outputs.build }}"
          APK="build/app/outputs/flutter-apk/astra-music-arm64-v8a-release.apk"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/build${BUILD_NUM}/astra-music-arm64-v8a-release.apk"

          VERSION_CODE="$BUILD_NUM"
          AAPT2=$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$AAPT2" ]; then
            VC=$("$AAPT2" dump badging "$APK" 2>/dev/null | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            if [ -n "$VC" ]; then VERSION_CODE="$VC"; fi
          fi
          echo "BUILD_NUM=$BUILD_NUM VERSION_CODE=$VERSION_CODE"

          rm -rf /tmp/updrepo && mkdir -p /tmp/updrepo && cd /tmp/updrepo
          printf '{\n  "buildNumber": %s,\n  "url": "%s"\n}\n' "$VERSION_CODE" "$DOWNLOAD_URL" > check.json
          cat check.json

          git init -q -b update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add check.json
          git commit -q -m "chore: update check.json to build${BUILD_NUM} [skip ci]"

          for attempt in 1 2 3; do
            if git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" update:update; then
              echo "Pushed check.json successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed — retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push check.json after 3 attempts."
          exit 1

      - name: Notify users of new update (FCM push)
        # Best-effort: a push-notification hiccup must never fail the build.
        continue-on-error: true
        # Runs on every release now (gate removed, see Create Release
        # above). Separately, and regardless of that: silently skipped
        # (not failed) if the FIREBASE_SERVICE_ACCOUNT secret hasn't been
        # added yet, so this step is a no-op until FCM_SETUP.md's steps
        # are done, rather than breaking the whole release pipeline for
        # anyone who hasn't set up push notifications yet.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret not set — skipping push notification (see FCM_SETUP.md)."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/fcm-service-account.json
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('/tmp/fcm-service-account.json'))['project_id'])")

          # OAuth2 access token via the service account's private key (JWT
          # bearer flow) — no extra CLI/tooling needed beyond openssl+curl,
          # which every ubuntu-latest runner already has.
          #
          # YAML-SAFETY NOTE: every line of this embedded Python script is
          # kept indented at least as far as this `run: |` block's own
          # baseline indentation (10 spaces) — a literal block scalar in
          # YAML ends at the first line indented LESS than its first
          # content line, so a flush-left heredoc body here would
          # silently truncate the workflow (everything after would be
          # parsed as sibling YAML keys, not job steps) rather than
          # failing loudly. textwrap.dedent() strips that shared leading
          # whitespace back off before Python actually runs the code, so
          # this indentation is purely to keep YAML's parser happy and
          # has zero effect on the script's actual behavior.
          python3 - <<'PYEOF'
          import json, time, base64, subprocess, textwrap

          src = textwrap.dedent("""
          import json, time, base64, subprocess, os

          with open('/tmp/fcm-service-account.json') as f:
              sa = json.load(f)

          now = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          claims = {
              "iss": sa["client_email"],
              "scope": "https://www.googleapis.com/auth/firebase.messaging",
              "aud": "https://oauth2.googleapis.com/token",
              "iat": now,
              "exp": now + 3600,
          }

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          signing_input = f"{b64url(json.dumps(header).encode())}.{b64url(json.dumps(claims).encode())}"

          with open('/tmp/pkey.pem', 'w') as f:
              f.write(sa["private_key"])

          sig = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", "/tmp/pkey.pem"],
              input=signing_input.encode(), capture_output=True, check=True
          ).stdout
          jwt = f"{signing_input}.{b64url(sig)}"

          with open('/tmp/jwt.txt', 'w') as f:
              f.write(jwt)
          """)
          exec(src)
          PYEOF

          JWT=$(cat /tmp/jwt.txt)
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${JWT}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")

          curl -s -X POST "https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"message\": {
                \"topic\": \"updates\",
                \"notification\": {
                  \"title\": \"Update available\",
                  \"body\": \"A new version of Astra Music is ready to install.\"
                }
              }
            }"

          rm -f /tmp/fcm-service-account.json /tmp/pkey.pem /tmp/jwt.txt

  # ════════════════════════════════════════════════════════════════════════
  # WEB PREVIEW — builds a browser-viewable version of the UI and publishes
  # it to GitHub Pages, so the design can be checked from a phone browser
  # in ~2-3 min instead of waiting on a full APK build. This is UI/layout
  # preview only: native-only features (Hive local storage, background
  # audio, downloads, native login flows, etc.) will not work identically
  # on web — treat this as "does the screen look right", not a functional
  # test. Runs independently of the `build` job above (separate job, same
  # trigger) so it can never block or slow down the real APK pipeline; if
  # this job fails, the APK build is unaffected.
  web-preview:
    # Sirf manual run pe — har push pe chalane se artifact quota bhar raha tha
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Enable web support and scaffold web/ if missing
        # FIX (no web/ folder in this repo yet — it's a mobile-only
        # project): `flutter create --platforms=web .` is safe to run
        # every time — it only adds/updates the web/ scaffolding files
        # and never touches lib/ or any other existing source, so it
        # won't conflict with or overwrite app code on repeat runs.
        run: |
          flutter config --enable-web
          flutter create --platforms=web .

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (release, relative base-href for Pages subpath)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
