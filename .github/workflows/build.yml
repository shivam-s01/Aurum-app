name: Build Aurum Music APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed so the auto-translate step can commit + push newly generated app_xx.arb files back to the branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN checkout is read-only for pushes back to
          # the branch; persist-credentials keeps the token wired up so
          # the later "git push" from the auto-translate step works
          # without needing a separate PAT secret.
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/aurum-release.jks

      - name: Write key.properties
        run: |
          printf 'storePassword=${{ secrets.STORE_PASSWORD }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=aurum-release.jks\n' > android/key.properties

      - name: Flutter clean (prevent stale build artifacts)
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Auto-translate missing languages
        # Adding a language is now a one-file change: add a Locale('xx')
        # entry (+ name/flag) to lib/config/languages.dart and push.
        # This step diffs that list against the .arb files already in
        # lib/l10n/, and for anything missing, machine-translates
        # app_en.arb into a new app_xx.arb before the build compiles the
        # localization sources. Existing .arb files are never touched or
        # overwritten — only genuinely missing languages are generated.
        # See .github/scripts/auto_translate.py for full details.
        run: python3 .github/scripts/auto_translate.py

      - name: Commit auto-generated translations back to the branch
        # So the generated .arb files land in git (not just in this
        # run's ephemeral build), and the next build for an unchanged
        # language list has nothing left to translate.
        run: |
          if [ -n "$(git status --porcelain lib/l10n/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/l10n/app_*.arb
            git commit -m "chore: auto-generate translations for new language(s) [skip ci]"
            git push
          else
            echo "No new translation files to commit."
          fi

      - name: Analyze (safety gate — stops here on real errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Set build number from run number
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '\r')
          NEW_VERSION="${BASE_VERSION}+${{ github.run_number }}"
          sed -i "s/^version:.*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "Set pubspec.yaml version to ${NEW_VERSION}"

      - name: Build Release APK
        # FIX (build failures from transient upstream 429 "Too Many
        # Requests" on plugins.gradle.org / repo.maven.apache.org):
        # Gradle's own internal dependency-download retry only waits
        # ~100ms between attempts — nowhere near long enough to outlast
        # a server-side rate-limit window, so it was hitting the same
        # 429 again immediately and failing the whole build. This wraps
        # the actual build command in its own retry loop with real
        # backoff (30s, then 60s) so a transient rate-limit has an
        # actual chance to clear before the next attempt, instead of
        # requiring a manual empty-commit re-run every time it happens.
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi; then
              exit 0
            fi
            echo "Build attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              wait_seconds=$((attempt * 30))
              echo "Waiting ${wait_seconds}s before retrying (likely a transient upstream rate-limit)..."
              sleep "$wait_seconds"
            fi
          done
          echo "Build failed after 3 attempts."
          exit 1

      - name: Get version
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          BUILD=$(echo $VERSION | cut -d'+' -f2)
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurum-music-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Check release opt-in
        id: release_gate
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[release]"* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Commit message doesn't contain [release] — build artifact is available above, but no public release was created. Nobody's app will be prompted to update from this run."
          fi

      - name: Create Release
        if: steps.release_gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build${{ steps.ver.outputs.build }}
          name: Build ${{ steps.ver.outputs.build }}
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════
  # WEB PREVIEW — builds a browser-viewable version of the UI and publishes
  # it to GitHub Pages, so the design can be checked from a phone browser
  # in ~2-3 min instead of waiting on a full APK build. This is UI/layout
  # preview only: native-only features (Hive local storage, background
  # audio, downloads, native login flows, etc.) will not work identically
  # on web — treat this as "does the screen look right", not a functional
  # test. Runs independently of the `build` job above (separate job, same
  # trigger) so it can never block or slow down the real APK pipeline; if
  # this job fails, the APK build is unaffected.
  web-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Enable web support and scaffold web/ if missing
        # FIX (no web/ folder in this repo yet — it's a mobile-only
        # project): `flutter create --platforms=web .` is safe to run
        # every time — it only adds/updates the web/ scaffolding files
        # and never touches lib/ or any other existing source, so it
        # won't conflict with or overwrite app code on repeat runs.
        run: |
          flutter config --enable-web
          flutter create --platforms=web .

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (release, relative base-href for Pages subpath)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
