name: Build Astra Music (Play Store AAB)

# Manual only — never runs on push. Produces a signed .aab for Google Play.
# The website APK workflow (build.yml) is untouched by this file.
on:
  workflow_dispatch:

concurrency:
  group: play-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/aurum-release.jks

      - name: Write key.properties
        run: |
          printf 'storePassword=${{ secrets.STORE_PASSWORD }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=aurum-release.jks\n' > android/key.properties

      - name: Strip Play-restricted permission (this CI workspace only)
        # Play restricts REQUEST_INSTALL_PACKAGES (self-installing APKs).
        # Removed here, in the throwaway CI checkout only — the repo
        # manifest and the website APK keep it.
        run: |
          sed -i '/android.permission.REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
          if grep -q "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml; then
            echo "Permission still present in manifest"; exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Compute version
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '\r')
          # Same scheme as build.yml: seconds since 2024-01-01 UTC, always increasing.
          BUILD_NUMBER=$(( $(date -u +%s) - 1704067200 ))
          BUILD_LABEL="$(TZ=Asia/Kolkata date +%y%m%d).${GITHUB_RUN_NUMBER}"
          echo "BASE_VERSION=${BASE_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "BUILD_LABEL=${BUILD_LABEL}" >> "$GITHUB_ENV"
          echo "Play build ${BASE_VERSION} (${BUILD_NUMBER}), label ${BUILD_LABEL}"

      - name: Build signed AAB
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="$BASE_VERSION" --build-number="$BUILD_NUMBER" \
            --dart-define=BUILD_LABEL="$BUILD_LABEL" \
            --dart-define=PLAY_BUILD=true

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: astra-music-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: astra-music-play-symbols
          path: build/symbols
